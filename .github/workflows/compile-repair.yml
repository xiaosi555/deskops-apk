name: Native source compile audit

on:
  push:
    branches: [repair/native-code-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source repair pass
        run: |
          python3 tools/repair_native.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Repair native Kotlin source consistency [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Kotlin compile check only (no APK packaging)
        run: gradle --no-daemon :app:compileDebugKotlin
