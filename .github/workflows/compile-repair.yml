name: Native source compile audit

on:
  push:
    branches: [repair/native-code-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source repair pass
        run: |
          python3 tools/repair_native.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Repair native Kotlin source consistency [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Kotlin compile check only (no APK packaging)
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Kotlin and resource integrity checks
        run: |
          python3 tools/ktcheck.py app/src/main/java
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path(".")
          json.loads((root / "app/src/main/assets/course_ops.json").read_text(encoding="utf-8"))
          xmls = list((root / "app/src/main").rglob("*.xml"))
          for path in xmls:
              ET.parse(path)
          manifest = ET.parse(root / "app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = manifest.find("application")
          assert app is not None
          assert app.attrib.get(android + "icon") == "@drawable/app_icon"
          strings = ET.parse(root / "app/src/main/res/values/strings.xml").getroot()
          app_name = next((x.text for x in strings.findall("string") if x.attrib.get("name") == "app_name"), None)
          assert app_name == "桌面课程", app_name
          icon = root / "app/src/main/res/drawable-nodpi/app_icon.webp"
          assert icon.is_file() and icon.stat().st_size > 0
          print(f"Resource integrity OK: {len(xmls)} XML files, course JSON valid, WebP icon present.")
          PY
          git diff --check
      - name: Android Lint (no APK packaging)
        run: gradle --no-daemon :app:lintDebug

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt
          if-no-files-found: ignore
