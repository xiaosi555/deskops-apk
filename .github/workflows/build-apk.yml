name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskops-webview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate original HTML and Android bridge
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/android-bridge.js
          grep -q '<title>桌面运维全能学习导师</title>' app/src/main/assets/index.html
          node --check app/src/main/assets/android-bridge.js

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskops-webview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.xiaosi555.deskops/.MainActivity
            sleep 45
            adb logcat -d -s DeskOpsSmoke:I | grep -q "APP_PAGE_READY"
            adb logcat -d -s DeskOpsSmoke:I | grep -q '"bridge":true'
            adb logcat -d -s DeskOpsSmoke:I | grep -q '"mediaPicker":true'
            adb logcat -d -s DeskOpsSmoke:I | grep -q '"mediaImport":true'
            adb logcat -d -s DeskOpsSmoke:I | grep -q '"tts":true'
            adb logcat -d -s DeskOpsSmoke:I | grep -q '"back":true'
            ! adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"
