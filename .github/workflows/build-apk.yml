name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskops-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modular JavaScript and original UI
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/android-bridge.js
          grep -q '<title>桌面运维全能学习导师</title>' app/src/main/assets/index.html
          ! grep -q '<script>.*SECTION:' app/src/main/assets/index.html
          for f in app/src/main/assets/js/*.js app/src/main/assets/android-bridge.js; do
            test -s "$f"
            node --check "$f"
          done
          count=$(grep -c 'src="/assets/js/' app/src/main/assets/index.html)
          test "$count" -eq 10
          echo "Validated $count ordered application JS files."
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK output
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deskops-modular-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
